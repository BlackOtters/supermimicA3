[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supermimic-a3"
version = "0.8.1"
description = "Standalone A3 Ultra SuperMimic v8 training and evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license-files = ["licenses/*.txt"]
dynamic = ["dependencies"]

[project.scripts]
a3-sm-train = "a3_supermimic.scripts.train:main"
a3-sm-data = "a3_supermimic.scripts.data:main"
a3-sm-eval = "a3_supermimic.scripts.evaluate:main"
a3-sm-check = "a3_supermimic.scripts.check_config:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a3_supermimic = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an idle NVIDIA GPU"]
